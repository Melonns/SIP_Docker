version: '3.8'

services:
  # -----------------------------------------------------
  # 1. DATABASE (MySQL 8)
  # -----------------------------------------------------
  db:
    image: mysql:8.0
    container_name: sip_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sip_docker
      MYSQL_ROOT_PASSWORD: sip_root_password
      MYSQL_USER: sip_user
      MYSQL_PASSWORD: sip_password
    ports:
      - "3307:3306"
    volumes:
      - sip_mysql_data:/var/lib/mysql
    networks:
      - sip_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------
  # 2. BACKEND (Laravel 10 - PHP 8.4 FPM)
  # -----------------------------------------------------
  backend-fpm:
    build:
      context: ./InternHub-BE
      dockerfile: Dockerfile
    container_name: sip_backend_fpm
    restart: unless-stopped
    volumes:
      - ./InternHub-BE:/var/www/html:delegated
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=sip_docker
      - DB_USERNAME=root
      - DB_PASSWORD=sip_root_password
      - MAIL_DRIVER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_FROM_ADDRESS=noreply@SIP.com
      - MAIL_FROM_NAME="SIP SIER"
      - RUN_SEEDERS=true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sip_network
    expose:
      - "9000"

  # --------- NGINX Web Server -----------
  nginx:
    build:
      context: ./InternHub-BE
      dockerfile: Dockerfile.nginx
    container_name: sip_nginx
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./InternHub-BE:/var/www/html:delegated
    depends_on:
      - backend-fpm
    networks:
      - sip_network

  # -----------------------------------------------------
  # 3. FRONTEND (React / Vite - Node 20)
  # -----------------------------------------------------
  frontend:
    build:
      context: ./InternHub-FE
      dockerfile: Dockerfile
    container_name: sip_frontend
    restart: unless-stopped
    ports:
      - "3000:5173"
    volumes:
      - ./InternHub-FE:/app:delegated
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_PROXY_TARGET=http://nginx:8000
    networks:
      - sip_network

  # -----------------------------------------------------
  # 4. MAILPIT (Local Email Testing)
  # -----------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: sip_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI (http://localhost:8025)
    environment:
      - MAILPIT_SMTP_BIND_ADDR=0.0.0.0:1025
      - MAILPIT_UI_BIND_ADDR=0.0.0.0:8025
    networks:
      - sip_network

  # -----------------------------------------------------
  # 5. PHPMYADMIN (Database UI Management)
  # -----------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sip_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: sip_root_password
      PMA_DATABASE: sip_docker
    depends_on:
      - db
    networks:
      - sip_network

volumes:
  sip_mysql_data:

networks:
  sip_network:
    driver: bridge