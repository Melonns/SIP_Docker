[global]
daemonize = no
log_level = warning

[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
listen.backlog = 511
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 5000
pm.process_idle_timeout = 30s
request_terminate_timeout = 300s
